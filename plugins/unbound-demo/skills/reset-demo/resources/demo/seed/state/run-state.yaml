# run-state.yaml — single source of truth (SoT) for the run/slate/coverage state machine (ADR-5, FR27).
# Human-readable and hand-editable (FR13); a hand-edited value must remain valid/parseable.
# Seed shape: the three REQUIRED top-level keys last_run, timezone, events — plus TWO OPTIONAL
# keys, scan_window (Story 2.7) and work (resume-to-close Story 1.1), both ADR-5 schema evolutions
# whose absence has a well-defined default, so no previously-scaffolded file needs migrating. This
# seed carries scan_window and NO work key — nothing is in flight in a fresh demo workspace. The
# work record shape is documented in its own block below. scan_window is OPTIONAL: when it is
# absent the discovery upper edge is unbounded (= now), which is byte-for-byte the prior behavior,
# so every existing/hand-edited run-state file (with only last_run/timezone/events) keeps working
# unchanged. Accepted values: `now` (unbounded) or a duration `<n>h` / `<n>d` (e.g. 6h, 24h, 2d),
# which bounds discovery to (last_run, min(last_run + W, now)]. A hand-edited scan_window must stay
# valid/parseable (FR13); an unparseable value is surfaced to the rep by run-unbound, never guessed.
# At session end, run-unbound advances last_run to that same upper edge — min(last_run + W, now) when
# bounded, now when unbounded — never to the session's wall-clock time, so events after the scanned
# window are never skipped; they fall into the next run's window.
last_run: 2026-06-18T18:00:00-04:00   # full ISO 8601 with offset (required) — "events since last run" date math (covers calls + unanswered inbound emails). DEMO ANCHOR: set just after the latest pre-run workspace activity (2026-06-18T15:06) and strictly before the earliest demo fixture signal (the 2026-06-19T09:30 Calla & Vale thread), so a fresh /run-unbound-demo discovers the whole seeded slate.
timezone: America/New_York          # explicit IANA timezone (required) — comparison is done in this zone
scan_window: now                     # OPTIONAL (default when absent = now/unbounded). e.g. `6h`, `24h`, `2d`.

# EVENT RECORD SHAPE (canonical — durable-event-tracking Story 1.1; this seed migrated to it by
# resume-to-close Story 1.4). The REQUIRED top-level `events` list is the durable record of every
# call and unanswered email discovery has found. It replaces the pre-`events` account-centric
# `queue` rows: the slate is no longer stored, it is DERIVED — build-slate Step 4 groups every
# `processing_status: pending` record by (namespace, slug) and emits ONE CARD PER GROUP, so a row's
# signals are read off its members rather than denormalized onto it.
#   { event_id          (REQUIRED, "<source>:<external_ref>" — the deterministic upsert key.
#                        Re-discovering the same event resolves to the same id and updates in
#                        place; events are never duplicated and never deleted),
#     source            (REQUIRED, enum: call | email),
#     external_ref      (REQUIRED — the re-fetch pointer: the calendar event ref for a call, the
#                        mail thread_ref for an email. `null` ONLY on events migrated from the
#                        pre-`events` schema, which never stored one; every record in this seed
#                        carries a real ref, because the fixtures under runtime/demo/fixtures/
#                        supply them),
#     occurred_at       (REQUIRED, full ISO 8601 with offset, verbatim from the source; compared
#                        in this file's timezone),
#     namespace         (REQUIRED, enum: accounts | projects),
#     slug              (REQUIRED, kebab-case — the coverage key groups form on),
#     evidence_status   (REQUIRED, enum: present | missing | unknown. All three are first-class:
#                        the event stays on the slate and stays selectable whichever it is.
#                        Evidence CONTENT is never stored here — recovery is pointer + re-fetch
#                        via external_ref, and it writes nothing back),
#     processing_status (REQUIRED, enum: pending | processed. `pending` at upsert. It flips to
#                        `processed` at exactly ONE site in the corpus: work-account's
#                        ADVANCE-PHASE at `closed` — the run's CLOSE-OUT — and only on the
#                        contributing event_ids[] its work record names. There is no per-account
#                        flag, and nothing flips at plan generation) }
# OPTIONAL display annotations, never fabricated: `call_type` (calls — verbatim from the call
# event) and `subject` (emails — verbatim from the thread). A group carrying BOTH a call and an
# email member renders both pills on one card; that is how one account collapses to one row.
#
# WORK RECORD SHAPE (canonical — resume-to-close Story 1.1). The OPTIONAL top-level `work` list
# describes the IN-FLIGHT cycle: one record per item currently being worked, carrying how far that
# item's cycle has got and which events its plan was synthesized from.
# `work` IS OPTIONAL AND ITS ABSENCE MEANS NOTHING IS IN FLIGHT — which is why this seed carries no
# `work` key at all: a fresh demo workspace has nothing in flight, and a file that never carried the
# key stays valid with no migration (the same optional-key/absent-default evolution scan_window
# follows, ADR-5). An EMPTY list means exactly the same thing.
#   { namespace  (REQUIRED, enum: accounts | projects),
#     slug       (REQUIRED, kebab-case — the item being worked; the same coverage key rows group on),
#     phase      (REQUIRED, enum: planned | triaged | executed — how far the cycle has got.
#                 `closed` is a TRANSITION, never a value at rest: closing a cycle DELETES its
#                 record, so a record at rest is only ever in one of the three phases above),
#     plan_date  (REQUIRED, YYYY-MM-DD in this file's timezone — pins the authoritative plan file
#                 accounts|projects/<slug>/drafts/<plan_date>-tasks.yaml for this cycle),
#     started_at (REQUIRED, ISO 8601 with offset, same format as last_run — bounds the cycle's
#                 verdict window),
#     event_ids  (REQUIRED, NON-EMPTY list of strings, each one an event_id of a durable event
#                 record — the event-to-plan linkage, which is recorded nowhere else on disk) }
# There are NO optional keys inside a record: all six are REQUIRED. At most ONE record per
# (namespace, slug) — the same item is never in flight twice.
# Hand-editing (FR13): to retire a cycle, DELETE its whole record — an absent record is the resting
# state, not an error. To resume one by hand, add a record with all six keys.
#
# Example of a fully-populated work record (its event_ids name real records from the list below):
#   work:
#     - namespace: accounts
#       slug: brightwater-media
#       phase: triaged
#       plan_date: 2026-06-22
#       started_at: 2026-06-22T10:32:04-04:00
#       event_ids: ["call:cal_brightwater_20260622"]
#
# DEMO PRE-RUN STATE (fictional accounts, no real person's data): `events` carries the 6 durable
# records — 4 calls + 2 unanswered email threads — that the fixtures under runtime/demo/fixtures/
# discover, ALL processing_status:pending, so the slate derives to the 5 demo items even before
# discovery runs and a fresh /run-unbound-demo re-discovers the same events idempotently
# (build-slate upserts each fixture event onto its existing event_id rather than adding a second
# record). The occurred_at values below are therefore deliberately LATER than last_run — they
# describe the events discovery is about to find, not history the rep has already worked. Nothing
# flips when the plan is built: work-account flips ONLY the worked item's contributing events to
# processing_status:processed at close-out, and run-unbound advances last_run at session end.
# Resetting the workspace from runtime/demo/seed/ restores these records and the anchor, so every
# showing reproduces the same 5-item slate: brightwater-media present-call (the walk target),
# marlin-bay-cruises present-call, halvorsen-pike present-call, calla-vale email-only, and
# goldspire-resorts as one collapsed row carrying a missing-transcript call AND an unanswered
# email — the two-events-from-one-account case. Record order below is the order the cards derive in.
events:
  - { event_id: "call:cal_brightwater_20260622", source: call,
      external_ref: cal_brightwater_20260622,
      occurred_at: 2026-06-22T10:00:00-04:00,
      namespace: accounts, slug: brightwater-media,
      call_type: discovery-and-install-scope,
      evidence_status: present, processing_status: pending }
  - { event_id: "call:cal_marlinbay_20260623", source: call,
      external_ref: cal_marlinbay_20260623,
      occurred_at: 2026-06-23T14:00:00-04:00,
      namespace: accounts, slug: marlin-bay-cruises,
      call_type: pre-proposal-discovery,
      evidence_status: present, processing_status: pending }
  - { event_id: "call:cal_halvorsen_20260622", source: call,
      external_ref: cal_halvorsen_20260622,
      occurred_at: 2026-06-22T16:00:00-04:00,
      namespace: accounts, slug: halvorsen-pike,
      call_type: discovery-and-evaluation-scope,
      evidence_status: present, processing_status: pending }
  - { event_id: "email:thr_callavale_20260619", source: email,
      external_ref: thr_callavale_20260619,
      occurred_at: 2026-06-19T09:30:00-04:00,
      namespace: accounts, slug: calla-vale,
      subject: "Re: QBR follow-up — install fee for a second team, and re-engagement terms",
      evidence_status: present, processing_status: pending }
  - { event_id: "call:cal_goldspire_20260621", source: call,
      external_ref: cal_goldspire_20260621,
      occurred_at: 2026-06-21T15:00:00-04:00,
      namespace: accounts, slug: goldspire-resorts,
      call_type: exec-readout,
      evidence_status: missing, processing_status: pending }
  - { event_id: "email:thr_goldspire_20260620", source: email,
      external_ref: thr_goldspire_20260620,
      occurred_at: 2026-06-20T11:00:00-04:00,
      namespace: accounts, slug: goldspire-resorts,
      subject: "Who approves the draft? — after Wade's readout",
      evidence_status: present, processing_status: pending }
