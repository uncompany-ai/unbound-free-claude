tasks:
  - id: t1
    title: "Send post-call follow-up to Marlin Bay Cruises (agreed measures + peer durability proof)"
    type: followup_email
    priority: 1
    rationale: "Stage is proposal and Diane has asked for terms. A short recap that mirrors back the three measures she is judged on — admin minutes per seller per day, enquiry turnaround, forecast accuracy — and attaches proof from a comparable operator keeps the proposal built on her numbers rather than ours, which is the condition she set."
    evidence: "transcript: 'the proposal maps to three numbers. Admin minutes per seller per day. Enquiry turnaround. Forecast accuracy. Those are what I am judged on' (Diane) / 'Send me something I can put in front of them — a comparable operator who installed this and is still running it a couple of quarters later, with the numbers' (Diane)"
    context:
      recipients: ["Diane Halloran (VP revenue operations)", "cc: Priscilla Nunez (sales enablement)"]
      asks:
        - "Confirm the three measures the proposal maps to and nothing else: admin minutes per seller per day, enquiry turnaround, forecast accuracy"
        - "Attach the peer durability proof for the exec review — a comparable desk still running the workflow two quarters on, with the numbers as measured"
        - "Confirm it adds no line to their stack: the agent runs in the seats IT rolled out in January, paid direct, with one install fee from us"
        - "Confirm the working session to walk the draft proposal against those measures"
      asset_hint: "Durability Proof — Still Running Six Months On (assets.md, proposal)"
    proposed_action: draft_email
    status: done
  - id: t2
    title: "Assemble the proposal mapped to the three agreed measures"
    type: create_proposal
    priority: 2
    rationale: "Proposal stage starts when the buyer asks for commercial terms. The document has to tie the install scope and the fee to the three measures Diane named, and say when the engagement closes, so the exec review reads a bounded piece of work rather than an open-ended vendor relationship."
    evidence: "transcript: 'It maps to those three and nothing else' (Nadia, agreed by Diane) / 'When the install closes the engagement closes, and you keep the config' (Nadia)"
    context:
      scope: "Install scope for the group-charter desk, the install fee, the named re-engagement price, and the close-out date — every line tied to one of the three agreed measures"
      audience: "Diane (economic buyer) and the exec review panel"
    proposed_action: draft_proposal
    status: done
  - id: t3
    title: "Answer Owen's outstanding question — proof from Marlin Bay's own sellers"
    type: answer_questions
    priority: 3
    rationale: "Owen runs the floor and has watched two rollouts die on it, so his question is the one that decides adoption rather than the one that decides the proposal. He is not blocking, and the honest answer is a measured number off their own desk after the first live week — which does not exist yet, so the task waits rather than being answered with a projection."
    evidence: "transcript: 'Owen. He runs the floor and he has watched two rollouts die on it. He is not blocking the proposal. But eventually he wants a number off our own sellers, not a vendor slide' (Diane) / rep direction 2026-06-15: hold the baseline ask this round, report back once the first week is measured"
    context:
      questions:
        - "What do admin minutes per seller per day look like on Marlin Bay's own desk after the first live week, measured against their baseline?"
        - "What share of agent-written drafts do their sellers approve without editing, and what do the edits change?"
      deferred_reason: "Answering honestly needs a measured first live week on their own desk; a projection is exactly the vendor slide Owen has already discounted twice."
    proposed_action: draft_answers
    status: deferred
dropped:
  - "Standalone walkthrough send — Diane has seen the loop; at proposal stage the durability proof and the document carry the weight, and a second asset in one follow-up buries the ask."
open_questions:
  - "Which execs sit on the review panel Diane is preparing for, and which of the three measures does each of them actually care about?"
  - "Is forecast accuracy measurable on their side today, given the forecast is rebuilt by hand on Thursday nights?"
next_step:
  proposed: true
  description: "Hold a working session the week of June 22 with Diane and Priscilla to walk the draft proposal against the three agreed measures; offer candidate times for the required attendees."
