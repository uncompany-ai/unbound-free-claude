tasks:
  - id: t1
    title: "Send post-call follow-up to Goldspire (propose the tailored session for the three desks)"
    type: followup_email
    priority: 1
    rationale: "Stage is demo and an exec now feels the pain. A recap to Wade that proposes a session on a live Goldspire group booking — rather than a generic walkthrough — converts exec interest into a scheduled session, and attaching the recorded walkthrough lets Lina and the floor see the approval step before anyone commits a room to it."
    evidence: "inferred: no transcript captured for the 2026-06-16 scoping call; grounded in context.md plus the meeting outcome — Wade sponsors it at exec level and wants the floor to see the loop run on Goldspire work."
    context:
      recipients: ["Wade Coburn (SVP marketing)", "cc: Lina Marchetti (sales operations)"]
      asks:
        - "Recap the case: three books that never see each other, and a follow-up after a site visit that gets written late or not at all"
        - "Propose a tailored session on a live group-booking thread rather than a generic walkthrough"
        - "Share the recorded walkthrough so the floor can see where the approval sits before the live session"
        - "Confirm a session date with the floor, hotel-desk and events sellers in the room"
      asset_hint: "Recorded Walkthrough — Agents in the AI Seat (assets.md, demo)"
    proposed_action: draft_email
    status: not-done
  - id: t2
    title: "Build the tailored session on a live group-booking thread across the three books"
    type: create_deck
    priority: 2
    rationale: "Demo stage exits when the audience has watched the loop run on work that looks like theirs. A session built on a real Goldspire group booking — the enquiry, the site visit, the follow-up that slipped — is what proves the point; a generic walkthrough proves nothing to a floor that has seen vendor demos before."
    evidence: "inferred: context.md — sellers work the casino floor, the hotel desk and events as three separate books, so the same customer is negotiated with three times and a booking in flight is visible only to whoever holds it."
    context:
      audience: "Wade (exec sponsor), Lina (sales operations), Bram (IT), Perrine (Salesforce administrator)"
      angle: "One live group booking followed end to end across the three books — the agent reads the thread, drafts the next move, the seller approves, and the record behind the negotiation stops being thinner than the conversation"
      pain_point: "Three books that never see each other, and the post-site-visit follow-up written from memory or not at all"
      source_pointers: ["Recorded Walkthrough — Agents in the AI Seat (assets.md, demo)"]
    proposed_action: ideate_content
    status: not-done
  - id: t3
    title: "Answer Lina's question on approval and sending, in writing"
    type: answer_questions
    priority: 3
    rationale: "Lina decides whether this is safe to put near a live negotiation, and her question is the draft-and-approve boundary itself. It deserves a plain written answer, but it lands far better shown than asserted — so it is deferred to the tailored session where the approval step is on screen."
    evidence: "inferred: raised by Lina on the 2026-06-16 scoping call — who approves the draft, and what stops it sending on its own while a group booking is still being negotiated."
    context:
      questions:
        - "Who approves the draft, and what stops it sending on its own while a group booking is still being negotiated?"
        - "When a seller edits a draft before approving, what happens to the record behind the booking?"
      deferred_reason: "Best shown live in the tailored session with the approval step on screen, rather than asserted in prose now."
    proposed_action: draft_answers
    status: deferred
dropped:
  - "Pricing send — premature at demo stage; the tailored session and Lina's approval question come first, and pricing before the floor has seen it reads as a push."
open_questions:
  - "Which live group booking can be used in the session, and who has to approve using a real thread in a room?"
  - "Does Bram need to be in the session to speak to what the install touches, or is a separate conversation cleaner?"
next_step:
  proposed: true
  description: "Schedule a tailored session on a live group-booking thread with the floor, hotel-desk and events sellers; offer candidate times for Wade, Lina and Bram."
